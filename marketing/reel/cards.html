<!doctype html>
<html><head><meta charset="utf-8"><title>Dale reel cards</title>
<style>
@font-face{font-family:"Bodoni Moda";font-weight:500;src:url(/www/fonts/bodoni-moda-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:400;src:url(/www/fonts/manrope-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:600;src:url(/www/fonts/manrope-latin-600-normal.woff2) format("woff2")}
/* 1080×1920 reel frames: title card (animated by ?t=), end card, and transparent bottom-third text overlays */
:root{--bg:#0a0a0a;--ink:#f4f1ec;--muted:#8e8a84}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
.card{position:absolute;inset:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px}
.icon{width:300px;height:300px}
.icon path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.mark{font:500 200px/1 "Bodoni Moda",Georgia,serif;letter-spacing:.005em}
.line{font:400 54px/1.3 Manrope,sans-serif;color:var(--muted);text-align:center}
.small{font:600 30px Manrope,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.end .mark{font-size:150px}.end .icon{width:200px;height:200px}
.end .big{font:500 76px/1.2 "Bodoni Moda",Georgia,serif;text-align:center}
.overlay{position:absolute;left:0;right:0;bottom:0;height:640px;background:linear-gradient(to bottom,rgba(10,10,10,0),rgba(10,10,10,.88) 45%,rgba(10,10,10,.96));display:flex;align-items:flex-end;padding:0 84px 210px;box-sizing:border-box}
.overlay p{margin:0;font:500 82px/1.12 "Bodoni Moda",Georgia,serif;color:var(--ink);text-wrap:balance}
</style></head>
<body>
<script>
const q=new URLSearchParams(location.search), card=q.get("card"), t=+q.get("t")||0;
const ease=x=>x<=0?0:x>=1?1:1-Math.pow(1-x,3), seg=(a,b)=>ease((t-a)/(b-a));
const icon=`<svg class="icon" viewBox="0 0 32 32"><path d="M9 9v14M23 9v14M5 12v8M27 12v8M9 16h14"/></svg>`;
if(card==="title"){
  // 0–0.9 s the dumbbell draws itself, 0.6–1.4 s "Dale" rises in, 1.2–1.9 s the line fades in
  document.body.innerHTML=`<div class="card">${icon}<div class="mark">Dale</div><div class="line">Your trainer.<br>In your pocket.</div></div>`;
  // dashes restart on every subpath, so each stroke of the dumbbell is its own path, drawn in turn
  const strokes=[["M9 9v14",14],["M23 9v14",14],["M5 12v8",8],["M27 12v8",8],["M9 16h14",14]];
  document.querySelector(".icon").innerHTML=strokes.map(([d,len],i)=>{ const k=seg(i*.14,i*.14+.34); return `<path d="${d}" stroke-dasharray="${len} ${len}" stroke-dashoffset="${len*(1-k)}" opacity="${k>0?1:0}"/>`; }).join("");
  const m=document.querySelector(".mark"); m.style.opacity=seg(.6,1.4); m.style.transform=`translateY(${(1-seg(.6,1.4))*40}px)`;
  document.querySelector(".line").style.opacity=seg(1.2,1.9);
}else if(card==="end"){
  document.body.innerHTML=`<div class="card end">${icon}<div class="mark">Dale</div><div class="big">No ads. No paywall.<br>No excuses.</div><div class="small">${q.get("sub")||"Coming soon to Google Play"}</div></div>`;
}else if(card==="overlay"){
  document.body.innerHTML=`<div class="overlay"><p>${(q.get("text")||"").replace(/[<>&]/g,"")}</p></div>`;
}
document.fonts.ready.then(()=>document.title="ready");
</script>
</body></html>
